x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true

services:
  nginx:
    <<: *security-defaults
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - directus
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_TEMPLATE_FILE: default.http.conf.template
    command: >
      /bin/sh -c "set -e;
      envsubst '$$NGINX_SERVER_NAME' < /etc/nginx/templates/$${NGINX_TEMPLATE_FILE} > /etc/nginx/conf.d/default.conf;
      (while :; do sleep 6h & wait $${!}; nginx -s reload; done) &
      exec nginx -g 'daemon off;'"
    ports:
      - "${APP_HTTP_BIND:-0.0.0.0}:${APP_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/www:/var/www/certbot:ro
      - onlinelessons_media:/srv/media:ro
      - onlinelessons_static:/srv/static:ro
    networks:
      - shared

  certbot:
    <<: *security-defaults
    image: certbot/certbot
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!};
      done"
    volumes:
      - ./certbot/conf:/etc/letsencrypt/:rw
      - ./certbot/www:/var/www/certbot/:rw
    networks:
      - shared

  database:
    <<: *security-defaults
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD:?POSTGRES_SUPERPASSWORD is required}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${APP_DB_NAME:-online_lessons}
      APP_DB_USER: ${APP_DB_USER:-online_lessons}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      DIRECTUS_DB_NAME: ${DIRECTUS_DB_NAME:-directus}
      DIRECTUS_DB_USER: ${DIRECTUS_DB_USER:-directus}
      DIRECTUS_DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:?DIRECTUS_DB_PASSWORD is required}
    volumes:
      - onlinelessons_postgres_data:/var/lib/postgresql/data
      - ../postgres/init/01-init-multiple-dbs.sh:/docker-entrypoint-initdb.d/01-init-multiple-dbs.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shared

  db_backup_app:
    <<: *security-defaults
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    depends_on:
      - database
    environment:
      POSTGRES_HOST: database
      POSTGRES_DB: ${APP_DB_NAME:-online_lessons}
      POSTGRES_USER: ${APP_DB_USER:-online_lessons}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      SCHEDULE: "@daily"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "2"
    volumes:
      - onlinelessons_backups:/backups
    networks:
      - shared

  db_backup_directus:
    <<: *security-defaults
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    depends_on:
      - database
    environment:
      POSTGRES_HOST: database
      POSTGRES_DB: ${DIRECTUS_DB_NAME:-directus}
      POSTGRES_USER: ${DIRECTUS_DB_USER:-directus}
      POSTGRES_PASSWORD: ${DIRECTUS_DB_PASSWORD:?DIRECTUS_DB_PASSWORD is required}
      SCHEDULE: "@daily"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "2"
    volumes:
      - onlinelessons_backups:/backups
    networks:
      - shared

  cache:
    <<: *security-defaults
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shared

  mailpit:
    <<: *security-defaults
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_HTTP_BIND:-127.0.0.1}:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8025/api/v1/info >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
    networks:
      - shared

  directus:
    <<: *security-defaults
    image: directus/directus:11.3.5
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "${DIRECTUS_HTTP_BIND:-127.0.0.1}:${DIRECTUS_HTTP_PORT:-8055}:8055"
    volumes:
      - onlinelessons_directus_uploads:/directus/uploads
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DIRECTUS_DB_NAME:-directus}
      DB_USER: ${DIRECTUS_DB_USER:-directus}
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:?DIRECTUS_DB_PASSWORD is required}
      CACHE_ENABLED: "true"
      CACHE_STORE: redis
      REDIS: redis://cache:6379
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      EMAIL_TRANSPORT: ${DIRECTUS_EMAIL_TRANSPORT:-smtp}
      EMAIL_FROM: ${DIRECTUS_EMAIL_FROM:-no-reply@example.com}
      EMAIL_FROM_NAME: ${DIRECTUS_EMAIL_FROM_NAME:-OnlineLessons}
      EMAIL_SMTP_HOST: ${DIRECTUS_EMAIL_SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${DIRECTUS_EMAIL_SMTP_PORT:-1025}
      EMAIL_SMTP_USER: ${DIRECTUS_EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${DIRECTUS_EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_SECURE: ${DIRECTUS_EMAIL_SMTP_SECURE:-false}
      EMAIL_VERIFY_SETUP: ${DIRECTUS_EMAIL_VERIFY_SETUP:-false}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8055/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 8
    networks:
      - shared

networks:
  shared:
    name: onlinelessons_shared

volumes:
  onlinelessons_postgres_data:
    name: onlinelessons_postgres_data
  onlinelessons_directus_uploads:
    name: onlinelessons_directus_uploads
  onlinelessons_media:
    name: onlinelessons_media
  onlinelessons_static:
    name: onlinelessons_static
  onlinelessons_backups:
    name: onlinelessons_backups
