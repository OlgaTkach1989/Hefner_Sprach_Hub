services:
  nginx:
    environment:
      NGINX_TEMPLATE_FILE: default.https.conf.template
    ports:
      - "${APP_HTTP_BIND:-0.0.0.0}:${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_BIND:-0.0.0.0}:${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
      - onlinelessons_media:/srv/media:ro
      - onlinelessons_static:/srv/static:ro
