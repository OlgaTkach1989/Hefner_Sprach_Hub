name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: learning-portal
        run: npm install

      - name: Build
        working-directory: learning-portal
        env:
          VITE_PUBLIC_BASE_PATH: /Hefner_Sprach_Hub/
        run: npm run build

      - name: Add course information page
        run: |
          mkdir -p learning-portal/dist/angebot
          cp -R business-card/landing/. learning-portal/dist/angebot/
          mkdir -p learning-portal/dist/visitenkarte
          cp business-card/index.html business-card/card.css business-card/qr.svg learning-portal/dist/visitenkarte/
          mkdir -p learning-portal/dist/visitenkarte/landing
          cp business-card/landing/card-brand.css business-card/landing/logo.jpeg learning-portal/dist/visitenkarte/landing/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: learning-portal/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
